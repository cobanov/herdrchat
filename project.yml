# XcodeGen spec for the HerdrChat iOS app.
# Regenerate the .xcodeproj with:  xcodegen generate
#
# The app is a thin @main shell (in App/) that depends on the local Swift
# package's HerdrChatUI product, which pulls in HerdrNet (SSH) and HerdrKit.
name: HerdrChat
options:
  bundleIdPrefix: dev.herdr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HerdrChat:
    path: .

targets:
  HerdrChat:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HerdrChat
        product: HerdrChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdr.HerdrChat
        PRODUCT_NAME: HerdrChat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        # iPhone-only (a phone-first chat app); avoids iPad multitasking orientation rules.
        TARGETED_DEVICE_FAMILY: "1"
        # App Store distribution signing (managed automatically via the ASC API key).
        DEVELOPMENT_TEAM: "6U58AKY6F8"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: HerdrChat
        # herdr's SSH transport uses only standard/exempt encryption -> no CCATS filing.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Tailscale addresses are reached over the local network on iOS.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "herdr sunucularina Tailscale uzerinden baglanmak icin yerel ag erisimi gerekir."

schemes:
  HerdrChat:
    build:
      targets:
        HerdrChat: all
    run:
      config: Debug
    archive:
      config: Release
