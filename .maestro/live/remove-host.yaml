# Remove the host ${NAME} from the app, as scripts/e2e-live.sh does after its
# probes: Hosts, its row's Remove, and the confirmation.
appId: dev.herdr.HerdrChat
---
- launchApp
- extendedWaitUntil:
    visible:
      id: chats-view
    timeout: 20000
- tapOn:
    id: server-switcher
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: server-demo
    timeout: 10000
# A run that failed before Save has no host to remove.
- scrollUntilVisible:
    element:
      text: ${NAME}
    direction: DOWN
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: ${NAME}
    commands:
      - tapOn:
          text: Remove
          below:
            text: ${NAME}
      - tapOn:
          id: action-sheet-option-0
      - extendedWaitUntil:
          notVisible:
            text: ${NAME}
          timeout: 10000
