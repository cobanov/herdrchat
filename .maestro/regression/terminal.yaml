# A pane's terminal, on the Demo. The Demo's w6 ("api") has a shell pane,
# w6:p3, listed under its card after its two agents as a terminal row; it
# opens a terminal attached to that pane. The Demo opens a native echo shell
# (no SSH) and feeds it a recording: a zsh prompt in /home/demo/api, an `ls`,
# a coloured `git status`. Then the chat w2's header opens the same terminal
# on its agent's pane.
#
# Every attach is private (`herdr terminal attach` by the pane's terminal id,
# `herdr agent attach` for an agent): nothing on the host zooms or moves. That
# needs a host, so it is checked by hand on a device ("Terminal, by hand on a
# device" in .maestro/README.md: nothing moves on the desktop; two clients on
# one pane, and Take over). Here: the Demo's shell pane opens by its terminal
# id, and Take over is not offered on a pane nobody else holds.
#
# What SwiftTerm draws is not reliably in the accessibility tree, so the
# prompt and the echo are checked in the screenshots, which must be opened:
# `terminal-<appearance>` must show the coloured prompt, the listing and
# `ls` typed after the last prompt, in the app's colours, light and dark.
#
# The scroll to the shell's row is slow (`speed: 10`): at the default the
# swipe flung the list on past it, under the search field, and the tap opened
# the search instead of the terminal.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml
- scrollUntilVisible:
    element:
      id: terminal-row-w6:p3
    direction: DOWN
    centerElement: true
    speed: 10
- assertVisible:
    id: terminal-row-w6:p3
    text: 'Terminal in api, .*'
- takeScreenshot: terminal-row-${APPEARANCE}
- tapOn:
    id: terminal-row-w6:p3
- extendedWaitUntil:
    visible:
      id: terminal-status
      text: '.*Connected.*'
    timeout: 10000
- assertVisible:
    id: terminal-view
- assertNotVisible:
    id: terminal-reconnect
- assertNotVisible:
    id: terminal-takeover
# The keyboard, from the bar's own control, then typing into the terminal.
- tapOn:
    id: terminal-keyboard
- inputText: ls
- pressKey: enter
- assertVisible:
    id: terminal-status
    text: '.*Connected.*'
- takeScreenshot: terminal-${APPEARANCE}
# The bar's keys go to the shell; the echo shell takes them without a crash.
# After the screenshot, not before the typing: the echo shell sends Esc back
# to the terminal, which reads it and the next character as one escape
# sequence, so a typed `ls` after Esc drew as `s` (behind Tab's indent).
- tapOn:
    id: terminal-key-tab
- tapOn:
    id: terminal-key-esc
- tapOn:
    id: terminal-key-ctrl
- tapOn:
    id: terminal-key-ctrl
- assertVisible:
    id: terminal-status
    text: '.*Connected.*'
- tapOn:
    id: terminal-back
- extendedWaitUntil:
    visible:
      id: terminal-row-w6:p3
    timeout: 10000

# An agent's chat: the header's Terminal opens the agent's own screen.
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: UP
    centerElement: true
- tapOn:
    id: chat-row-w2
- extendedWaitUntil:
    visible:
      id: thread-terminal
    timeout: 15000
- tapOn:
    id: thread-terminal
- extendedWaitUntil:
    visible:
      id: terminal-status
      text: '.*Connected.*'
    timeout: 10000
- assertVisible:
    id: terminal-view
- takeScreenshot: terminal-agent-${APPEARANCE}
- tapOn:
    id: terminal-back
- extendedWaitUntil:
    visible:
      id: thread-title
    timeout: 10000
- tapOn:
    id: thread-back
