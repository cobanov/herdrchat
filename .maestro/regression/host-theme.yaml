# A host restyling the app through ~/.herdrchat/theme.json: Settings says
# Default, the Demo agent writes a theme when asked ("restyle the app",
# src/lib/demo/scenarios.ts), Reload theme picks it up and the row names it,
# and Reset to default moves the file aside so the row says Default again.
# Open the host-theme-applied screenshot: the tint must be the Demo's warm
# accent, not the app's periwinkle.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: toggle-host-themes
    direction: DOWN
# A failed earlier run can leave Use host themes off; this flow needs it on.
- runFlow:
    when:
      visible:
        id: toggle-host-themes
        checked: false
    commands:
      - tapOn:
          id: toggle-host-themes
# Waited for, not asserted: a failed earlier run can also leave the Demo's
# theme cached on the device, and the first check clears it. That check rides
# on the chat list's poll, so pass by Chats to let it run.
- tapOn: Chats
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: host-theme-row
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: host-theme-row
      text: 'Host theme, Default'
    timeout: 15000
# Off while the agent writes, so the chat list's own check (every 10 s, and
# at once on the way back from the thread) cannot pick the file up: only
# Reload theme can, which is what this flow tests.
- scrollUntilVisible:
    element:
      id: toggle-host-themes
    direction: DOWN
- tapOn:
    id: toggle-host-themes
- scrollUntilVisible:
    element:
      id: host-theme-row
      text: 'Host theme, Off'
    direction: UP

# The agent writes the file.
- tapOn: Chats
- tapOn:
    id: chat-row-w2
- extendedWaitUntil:
    visible:
      id: bubble-d2-2
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: restyle the app
- runFlow: _send.yaml
- extendedWaitUntil:
    visible: .*named it "Demo dusk".*
    timeout: 15000
- tapOn:
    id: thread-back

# Reload reads it, and the switch going back on shows what Reload stored.
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: host-theme-row
      text: 'Host theme, Off'
    direction: DOWN
- runFlow:
    when:
      notVisible:
        id: host-theme-reload
    commands:
      - tapOn:
          id: host-theme-row
- scrollUntilVisible:
    element:
      id: host-theme-reload
    direction: DOWN
- tapOn:
    id: host-theme-reload
- extendedWaitUntil:
    visible: 'Read just now: Demo dusk.'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: toggle-host-themes
    direction: DOWN
- tapOn:
    id: toggle-host-themes
- scrollUntilVisible:
    element:
      id: host-theme-row
      text: 'Host theme, Demo dusk.*'
    direction: UP
- takeScreenshot: host-theme-applied-${APPEARANCE}

# Reset moves it aside, and the app is back on its own colours.
- scrollUntilVisible:
    element:
      id: host-theme-reset
    direction: DOWN
- tapOn:
    id: host-theme-reset
- tapOn: Use the default theme
- extendedWaitUntil:
    visible:
      id: host-theme-row
      text: 'Host theme, Default'
    timeout: 10000
- takeScreenshot: host-theme-reset-${APPEARANCE}
- tapOn: Chats
