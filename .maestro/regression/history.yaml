# Reading a long chat back to its start (the Demo's `journal`: 520 transcript
# lines, a screenshot read every day). Reported: scrolling up sometimes threw
# the reader back to the end, and older messages could not be reached at all.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml
# Found by searching, not by scrolling: the Demo's list is longer than a
# screen, and its rows move between groups as agents finish, so a scrolled
# row could be under the search field by the time it was tapped.
- tapOn:
    id: chat-search
- inputText: journal
- hideKeyboard
- tapOn:
    id: chat-row-w5
# Opens on the end of the conversation.
- extendedWaitUntil:
    visible:
      id: bubble-h129-a
    timeout: 15000
- assertNotVisible: Beginning of conversation

# Scrolling up pages older history in as the reader nears the top, all the way
# to the first message, without the list ever jumping back to the end.
- scrollUntilVisible:
    element:
      id: bubble-h0-q
    direction: UP
    timeout: 240000
    speed: 90
    visibilityPercentage: 50
- assertVisible: Beginning of conversation
- takeScreenshot: history-start-${APPEARANCE}

# Left alone, the reader stays where they are: polls and the live tail keep a
# reader in history, they do not pull them to the end.
- waitForAnimationToEnd:
    timeout: 6000
- assertVisible:
    id: bubble-h0-q
- assertVisible:
    id: jump-to-bottom

# The jump button takes them back to the end.
- tapOn:
    id: jump-to-bottom
- extendedWaitUntil:
    visible:
      id: bubble-h129-a
    timeout: 10000
- takeScreenshot: history-end-${APPEARANCE}
