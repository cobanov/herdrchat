# A machine saved on the host (`herdr machine add`) lists its chats in the
# host's list. The Demo host saves one, `nuku` (id demo-nuku), with one idle
# Claude chat in workspace w1 "kenneth-bot", titled "Nightly digest" by its
# session; the Demo answers the machine's commands through the same ssh jump a
# real host runs (src/lib/demo/host.ts). Before, the app asked the host for
# its own snapshot only, and a chat on a machine was nowhere on the phone.
#
# A machine's row is `chat-row-<machineId>-<workspaceId>` (`rowTestKey`):
# its w1 is not the host's w1, and a connection id's slash has no place in a
# testID.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml
# The machine's list rides on the host's first poll, then nuku's own poll
# lands its rows after the host's; idle, so near the end.
- scrollUntilVisible:
    element:
      id: chat-row-demo-nuku-w1
    direction: DOWN
    centerElement: true
    timeout: 20000
# Titled by its session, and its line says which machine first.
- assertVisible:
    id: chat-row-demo-nuku-w1
    text: 'Nightly digest, nuku · .*'
# The host's own w1 is still its own row.
- assertVisible:
    id: chat-group-idle
- takeScreenshot: machines-list-${APPEARANCE}

- tapOn:
    id: chat-row-demo-nuku-w1
- extendedWaitUntil:
    visible: .*the backup job ran twice.*
    timeout: 15000
- assertVisible:
    id: thread-title
    text: Nightly digest
# The header names the machine first, once the first poll has bound it.
- extendedWaitUntil:
    visible:
      id: thread-meta
      text: 'nuku · .*'
    timeout: 10000
- tapOn:
    id: composer-input
- inputText: anything new tonight
- runFlow: _send.yaml
- extendedWaitUntil:
    visible: .*You said .anything new tonight.*
    timeout: 15000
- takeScreenshot: machines-${APPEARANCE}
- tapOn:
    id: thread-back

# The reply is on the machine's row, read by the visit; the host's w1 row
# never heard of it.
- scrollUntilVisible:
    element:
      id: chat-row-demo-nuku-w1
      text: .*You said .anything new tonight.*
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: chat-row-w1
    text: .*anything new tonight.*
