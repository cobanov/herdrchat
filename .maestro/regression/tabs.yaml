# The tab bar: Chats and Computers. Computers lists the Demo, with a button
# for its files and one for its terminal. Files browses the
# Demo's home folder and one folder in it; the terminal is a login shell on the
# Demo, the same terminal screen a pane's opens, pushed over the tabs.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

- tapOn: Computers
- extendedWaitUntil:
    visible:
      id: device-demo
    timeout: 5000
- takeScreenshot: computers-${APPEARANCE}

- tapOn:
    id: device-files-demo
- extendedWaitUntil:
    visible:
      id: files-entry-README.md
    timeout: 5000
- assertVisible:
    id: files-entry-code
- takeScreenshot: files-${APPEARANCE}
# A file downloads and opens the system's share sheet, on Android too (it once
# only said the file stayed in the app's storage). The sheet is the system's,
# so the check is that no error took its place; its screenshot must be opened.
- tapOn:
    id: files-entry-README.md
- waitForAnimationToEnd
- takeScreenshot: files-share-${APPEARANCE}
- assertNotVisible:
    id: error-banner
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    # The share sheet has no Close button on iOS 27; it goes with a swipe down
    # from its title. At 62% the swipe began on the sheet's top edge on a Pro
    # Max and left it open.
    commands:
      - swipe:
          start: 50%, 67%
          end: 50%, 98%
          duration: 300
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: files-entry-code
    timeout: 5000
- tapOn:
    id: files-entry-code
- extendedWaitUntil:
    visible: This folder is empty.
    timeout: 5000
- tapOn:
    id: files-up
- extendedWaitUntil:
    visible:
      id: files-entry-README.md
    timeout: 5000
- tapOn:
    id: files-devices
- assertVisible:
    id: device-demo

- tapOn:
    id: device-terminal-demo
- extendedWaitUntil:
    visible:
      id: terminal-view
    timeout: 10000
- tapOn:
    id: terminal-back
- extendedWaitUntil:
    visible:
      id: device-demo
    timeout: 5000

- tapOn: Chats
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 5000
