# The tab bar: Chats, Files and Terminal. Files browses the Demo's home folder
# and one folder in it, and Terminal opens a login shell on the Demo, the same
# terminal screen a pane's opens, pushed over the tabs and closed by Back.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

- tapOn: Files
- extendedWaitUntil:
    visible:
      id: files-device-demo
    timeout: 5000
- tapOn:
    id: files-device-demo
- extendedWaitUntil:
    visible:
      id: files-entry-README.md
    timeout: 5000
- assertVisible:
    id: files-entry-code
- takeScreenshot: files-${APPEARANCE}
- tapOn:
    id: files-entry-code
- extendedWaitUntil:
    visible: This folder is empty.
    timeout: 5000
- tapOn:
    id: files-up
- extendedWaitUntil:
    visible:
      id: files-entry-README.md
    timeout: 5000
- tapOn:
    id: files-devices
- assertVisible:
    id: files-device-demo

- tapOn: Terminal
- extendedWaitUntil:
    visible:
      id: terminal-device-demo
    timeout: 5000
- takeScreenshot: terminal-tab-${APPEARANCE}
- tapOn:
    id: terminal-device-demo
- extendedWaitUntil:
    visible:
      id: terminal-view
    timeout: 10000
- tapOn:
    id: terminal-back
- extendedWaitUntil:
    visible:
      id: terminal-device-demo
    timeout: 5000

- tapOn: Chats
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
