# The Chats menu. Chats is the app; New chat, Hosts and Settings are rows behind
# the "…" in its header, each presented as a sheet over the chats and closed by
# Done, which lands back on the same list. They used to be tabs, and a tab bar
# put a permanent strip of chrome under every conversation for screens opened
# a few times a week.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

# The menu itself, with the Demo selected. Its title is the host's name, which
# the subtitle under "Chats" shows too, and "New chat" is also the label of the
# "+" beside the menu, so neither proves the sheet is up; which rows it lists
# is pinned by src/lib/__tests__/mainMenu.test.ts. Read the screenshot.
- tapOn:
    id: chats-menu
- extendedWaitUntil:
    visible: Settings
    timeout: 5000
- assertVisible: Hosts
- takeScreenshot: menu-${APPEARANCE}
- tapOn: Settings
- waitForAnimationToEnd

# Settings: a row only Settings renders, not its title, which would also match
# a stale menu row. On iPad its sections are a sidebar inside the sheet.
- runFlow:
    when:
      visible:
        id: settings-section-conversations
    commands:
      - tapOn:
          id: settings-section-conversations
- scrollUntilVisible:
    element:
      id: toggle-tool-activity
    direction: DOWN
- takeScreenshot: menu-settings-${APPEARANCE}
# The Demo's w1 is blocked on a question, so the chats under this sheet count
# one chat that wants you, and Done carries that count: with the menu button
# covered by the sheet, it is the only sign of it while Settings is open.
- assertVisible:
    id: header-close-badge
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chat-row-w2
    timeout: 5000
- assertNotVisible:
    id: toggle-tool-activity

# Hosts: the Demo is listed, and Done goes back without changing the host.
- runFlow:
    file: _menu.yaml
    env:
      ITEM: Hosts
- assertVisible:
    id: server-demo
- assertVisible:
    id: header-close-badge
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chat-row-w2
    timeout: 5000
- assertNotVisible:
    id: server-demo

# New chat: the same sheet "+" opens. The "+" is labelled "New chat" too, but
# it is out of the accessibility tree while the menu is up, so only the row
# matches.
- runFlow:
    file: _menu.yaml
    env:
      ITEM: New chat
- assertVisible:
    id: field-cwd
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chat-row-w2
    timeout: 5000
- assertNotVisible:
    id: field-cwd

# A cold deep link into Settings (the HighlightOnLink route) still has the
# chats under it: Done lands on them instead of having nothing to go back to.
- stopApp
- openLink: herdrchat://settings?section=conversations
# The simulator asks before a custom scheme opens an app (Open in
# "HerdrChat"?); a phone tapping a link does too, once.
- runFlow:
    when:
      visible: Open in .HerdrChat.\?
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: header-close
    timeout: 15000
- scrollUntilVisible:
    element:
      id: toggle-tool-activity
    direction: DOWN
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chat-row-w2
    timeout: 10000
- assertNotVisible:
    id: toggle-tool-activity
