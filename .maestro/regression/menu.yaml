# The Chats header. New chat is its "+", Settings its gear and Hosts the host's
# name under the title, each presented as a sheet over the chats and closed by
# Done, which lands back on the same list. The tab bar holds Chats, Files and
# Terminal (tabs.yaml), not these: they are opened a few times a week.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

# Settings, from the gear beside "+" in the Chats header.
- runFlow:
    file: _menu.yaml
    env:
      ITEM: Settings

# Settings: a row only Settings renders, not its title, which would also match
# a stale menu row. On iPad its sections are a sidebar inside the sheet.
- runFlow:
    when:
      visible:
        id: settings-section-conversations
    commands:
      - tapOn:
          id: settings-section-conversations
- scrollUntilVisible:
    element:
      id: toggle-tool-activity
    direction: DOWN
- takeScreenshot: menu-settings-${APPEARANCE}
# The Demo's w1 is blocked on a question, so the chats under this sheet count
# one chat that wants you, and Done carries that count: with the menu button
# covered by the sheet, it is the only sign of it while Settings is open.
- assertVisible:
    id: header-close-badge
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: toggle-tool-activity

# Hosts: the Demo is listed, and Done goes back without changing the host.
- runFlow:
    file: _menu.yaml
    env:
      ITEM: Hosts
- assertVisible:
    id: server-demo
- assertVisible:
    id: header-close-badge
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: server-demo

# New chat: the sheet "+" opens.
- runFlow:
    file: _menu.yaml
    env:
      ITEM: New chat
- assertVisible:
    id: field-cwd
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: field-cwd

# A cold deep link into Settings (the HighlightOnLink route) still has the
# chats under it: Done lands on them instead of having nothing to go back to.
- stopApp
- openLink: herdrchat://settings?section=conversations
# The simulator asks before a custom scheme opens an app (Open in
# "HerdrChat"?); a phone tapping a link does too, once.
- runFlow:
    when:
      visible: Open in .HerdrChat.\?
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: header-close
    timeout: 15000
- scrollUntilVisible:
    element:
      id: toggle-tool-activity
    direction: DOWN
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 10000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: toggle-tool-activity
