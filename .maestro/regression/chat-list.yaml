# Pin, mute and the swipe actions on the chat list (PR #138, #139).
# Leaves the Demo as it found it: every pin and mute is undone.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

# Leading swipe: Pin and Mute, on w1, the chat that needs you at the top of
# the list. The space cards (w6's agents and terminals, by tab) now push w2 to
# the bottom edge, where the action is under the home indicator and its tap is
# lost; and scrolled down to w2, a Pinned group appearing at the top is above
# the screen by design, which is not what #138 is about (at a scroll of zero
# it must be on screen).
- swipe:
    from:
      id: chat-row-w1
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible:
    id: swipe-action-pin
- assertVisible:
    id: swipe-action-mute
- takeScreenshot: chat-list-leading-${APPEARANCE}
- tapOn:
    id: swipe-action-pin
# A group that appears at the top must be on screen, not above it (#138).
- extendedWaitUntil:
    visible:
      id: chat-group-pinned
    timeout: 5000
- assertVisible:
    id: chat-row-w1

# Long press: the same choices, now reading Unpin, and Mute.
- longPressOn:
    id: chat-row-w1
- tapOn: Mute notifications
- longPressOn:
    id: chat-row-w1
- assertVisible: Unpin
- assertVisible: Unmute notifications
- takeScreenshot: chat-list-menu-${APPEARANCE}
- tapOn: Unmute notifications
- longPressOn:
    id: chat-row-w1
- tapOn: Unpin
- assertNotVisible:
    id: chat-group-pinned

# Every row of the menu is there, and Cancel leaves it doing nothing. On
# Android it was an alert, which keeps three buttons: Close chat and Cancel
# were cut, and picking an action was the only way out.
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- longPressOn:
    id: chat-row-w2
- assertVisible: New terminal tab
- assertVisible: Split terminal
- assertVisible: Rename workspace…
- assertVisible: Close chat
- tapOn: Cancel
- assertNotVisible: Close chat

# A shell in the workspace, from the same menu. The Demo has no host to open
# one on and says so, in the list's own error banner.
- longPressOn:
    id: chat-row-w2
- tapOn: New terminal tab
- extendedWaitUntil:
    visible: .*your own host to open worktrees, tabs or terminals.*
    timeout: 10000
- takeScreenshot: chat-list-new-terminal-${APPEARANCE}
- tapOn: Dismiss
- assertNotVisible: .*your own host to open worktrees, tabs or terminals.*
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true

# Trailing swipe: Rename and Close, and it closes again cleanly.
# The Demo's two-agent workspace (w6) lists under Working, above Idle, with a
# row for each agent, which pushes w3 down to where the tab bar floats over
# it; brought up to the middle first, so the swipe starts on the row.
- scrollUntilVisible:
    element:
      id: chat-row-w3
    direction: DOWN
    centerElement: true
- swipe:
    from:
      id: chat-row-w3
    direction: LEFT
- waitForAnimationToEnd
- assertVisible:
    id: swipe-action-rename
# It renames the workspace, which a row titled by its session no longer shows.
- assertVisible:
    text: Rename workspace
- assertVisible:
    id: swipe-action-close
- takeScreenshot: chat-list-trailing-${APPEARANCE}
- swipe:
    from:
      id: chat-row-w3
    direction: RIGHT
- waitForAnimationToEnd
- assertNotVisible:
    id: swipe-action-close
