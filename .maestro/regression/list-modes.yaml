# The chats title is a picker: Spaces (a card per workspace, each agent of a
# workspace that runs several hung under it) or Agents (every agent a row of
# its own, flat; an agent the app cannot read, a terminal row). On the Demo,
# w2 "notes" has one agent and w6 "api" two, so
# Agents lists w2's agent as `chat-row-w2` (a one-agent workspace keeps its
# workspace's testID) and w6's agents as `chat-row-w6:p1` and
# `chat-row-w6:p2` (`agentTestKey`: the pane's id, since the two share their
# workspace's). The picker is the system sheet, so its rows are matched by
# text; the current view's row carries a tick ("Spaces ✓"). While it is up the
# list under it is out of the accessibility tree, so the text alone finds the
# row (a `below: chats-view` finds nothing to be below).
#
# The choice is saved, so this flow ends on Spaces, as every other flow
# expects; scripts/e2e.sh also clears it before and after this flow, in case
# a failed run stopped on Agents.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml
- assertVisible:
    id: chats-view
    text: Showing Spaces\. Change view\.

# Agents.
- tapOn:
    id: chats-view
- extendedWaitUntil:
    visible: Agents
    timeout: 5000
- assertVisible: Spaces ✓
- tapOn:
    text: Agents
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: chats-view
      text: Showing Agents\. Change view\.
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- assertVisible:
    id: chat-row-w2
    text: Release notes summary, Claude · demo/notes.*
# w6's agents, each a full row titled by its session, its line naming its
# workspace only when no folder on it does (here both folders say "api"). p2
# is working, so it sits in Working, above w2's Idle; p1 is idle, below it.
- scrollUntilVisible:
    element:
      id: chat-row-w6:p2
    direction: UP
    centerElement: true
- assertVisible:
    id: chat-row-w6:p2
    text: Save button wrap, Claude · api/web.*
- scrollUntilVisible:
    element:
      id: chat-row-w6:p1
    direction: DOWN
    centerElement: true
- assertVisible:
    id: chat-row-w6:p1
    text: Archived projects migration, Claude · demo/api.*
# No workspace card, no pane rows and no terminal rows in this view: w6's
# shell pane (w6:p3) is not an agent, and would sit under no card.
- assertNotVisible:
    id: chat-row-w6
- assertNotVisible:
    id: pane-row-w6:p1
- assertNotVisible:
    id: terminal-row-w6:p3
# The Demo's opencode (w9, "docs") has no reader: it is an agent all the same,
# so it has a terminal row of its own here, under no card, in Idle.
- scrollUntilVisible:
    element:
      id: terminal-row-w9:p1
    direction: DOWN
    centerElement: true
- assertVisible:
    id: terminal-row-w9:p1
    text: Terminal in docs, opencode · demo/docs
- takeScreenshot: list-agents-terminal-${APPEARANCE}
# Back to the top (w1 needs you, so it leads the list) for the screenshot.
- scrollUntilVisible:
    element:
      id: chat-row-w1
    direction: UP
- takeScreenshot: list-agents-${APPEARANCE}

# An agent's row opens that agent's own thread.
- scrollUntilVisible:
    element:
      id: chat-row-w6:p2
    direction: DOWN
    centerElement: true
- tapOn:
    id: chat-row-w6:p2
- extendedWaitUntil:
    visible:
      id: thread-title
      text: Save button wrap
    timeout: 15000
- extendedWaitUntil:
    visible: .*save button wraps.*
    timeout: 15000
- assertNotVisible: .*archived_at.*
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: chats-view
      text: Showing Agents\. Change view\.
    timeout: 5000

# Back to Spaces: w6 is a card again, with its two agents under it.
- tapOn:
    id: chats-view
- extendedWaitUntil:
    visible: Agents ✓
    timeout: 5000
- tapOn:
    text: Spaces
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: chats-view
      text: Showing Spaces\. Change view\.
    timeout: 5000
# The card to the middle, its two agents' rows below it: scrolled to p2, the
# list's swipe flung the card off the top behind the search field.
- scrollUntilVisible:
    element:
      id: chat-row-w6
    direction: DOWN
    centerElement: true
- assertVisible:
    id: chat-row-w6
    text: 'api, 2 agents, 1 working · 2 tabs · 4 panes · demo/api.*'
- assertVisible:
    id: pane-row-w6:p1
- assertVisible:
    id: pane-row-w6:p2
- assertNotVisible:
    id: chat-row-w6:p1
# And its shell pane's terminal row under them again.
- scrollUntilVisible:
    element:
      id: terminal-row-w6:p3
    direction: DOWN
    centerElement: true
    speed: 10
# Back to the top (w1 needs you, so it leads the list) for the screenshot.
- scrollUntilVisible:
    element:
      id: chat-row-w1
    direction: UP
- takeScreenshot: list-spaces-${APPEARANCE}
