# The private key field of the host editor stays reachable with the keyboard
# up. The form claimed to inset itself for the keyboard and never did, so a
# form that fit the sheet had nothing to scroll and the key sat under the keys.
# Maestro does not know what the keyboard covers, so open the screenshot: the
# key field must sit above the keyboard with its first line readable.
#
# The key field is found by its label and placeholder ("OpenSSH private key"
# then the placeholder), not by `field-secret`: the multiline input
# (iOS 26.4 simulator, Release build) reaches the accessibility tree with its
# label but without its identifier, while the one-line fields keep theirs.
# The bare label above it is the same words alone, so `.+` after a space
# leaves it out (`(?s)`: the placeholder runs over two lines).
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml
- tapOn:
    id: server-switcher
- extendedWaitUntil:
    visible:
      id: header-action
    timeout: 10000
- tapOn:
    id: header-action
- extendedWaitUntil:
    visible:
      id: field-name
    timeout: 10000
- tapOn: Private key
- scrollUntilVisible:
    element:
      text: '(?s)OpenSSH private key .+'
    direction: DOWN
- tapOn: '(?s)OpenSSH private key .+'
- inputText: "-----BEGIN OPENSSH PRIVATE KEY-----"
- waitForAnimationToEnd
# Typed into, the field holds the key (its label is then the bare words, its
# text what was typed), so the key's text is what finds it now.
- assertVisible: .*BEGIN OPENSSH PRIVATE KEY.*
- takeScreenshot: host-editor-key-${APPEARANCE}
- tapOn:
    id: header-close
