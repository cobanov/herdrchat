# Open one row of the Chats menu, the "…" beside "+" in the Chats header:
#   - runFlow:
#       file: _menu.yaml
#       env:
#         ITEM: Settings      # or Hosts, or New chat
# The menu is the system action sheet (a centred card on iOS 26, a popover on
# iPad), so its rows have no testIDs and are matched by their text. With the
# tab bar gone, nothing on the chats screen itself reads "Settings", so waiting
# for that row proves the sheet is up. "New chat" is not unique: the "+" beside
# the menu carries it as its label, so the row is tapped `below` the menu
# control, which the "+" shares a line with. Every screen a row opens is a
# sheet closed by `header-close`.
appId: dev.herdr.HerdrChat
---
- tapOn:
    id: chats-menu
- extendedWaitUntil:
    visible: Settings
    timeout: 5000
- tapOn:
    text: ${ITEM}
    below:
      id: chats-menu
- waitForAnimationToEnd
