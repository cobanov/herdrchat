# Open one of the screens the Chats header reaches:
#   - runFlow:
#       file: _menu.yaml
#       env:
#         ITEM: Settings      # or Hosts, or New chat
# Settings is the gear in the header, New chat the "+" beside it, and Hosts the
# host's name under the title (`server-switcher`). Chats, Files and Terminal
# are the tab bar under the screen. Every screen these open is a sheet closed
# by `header-close`.
appId: dev.herdr.HerdrChat
---
- runFlow:
    when:
      true: ${ITEM == 'Settings'}
    commands:
      - tapOn:
          id: chats-settings
      - extendedWaitUntil:
          visible:
            id: header-close
          timeout: 5000
- runFlow:
    when:
      true: ${ITEM == 'Hosts'}
    commands:
      - tapOn:
          id: server-switcher
      - extendedWaitUntil:
          visible:
            id: header-close
          timeout: 5000
- runFlow:
    when:
      true: ${ITEM == 'New chat'}
    commands:
      - tapOn:
          id: header-action
      - extendedWaitUntil:
          visible:
            id: header-close
          timeout: 5000
- waitForAnimationToEnd
