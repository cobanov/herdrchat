# Launch, reach every destination off the chats (the host switcher and the
# menu), assert a key element on each, and come back.
#
# Deliberately does NOT need a server: it covers the shape of the app, not its
# connection. `add-server.yaml` is the one that proves SSH really works.
appId: dev.herdr.HerdrChat
---
# Explicit cold start so every assertion begins from the root screen.
# (clearState would restart cleanly but also wipes the dev client's bundler URL.)
- stopApp
- launchApp
- runFlow: regression/_skip-welcome.yaml
- waitForAnimationToEnd
- assertVisible: "Chats"

# The host switcher sits under the title and is the quickest way to change
# hosts from the primary screen. It presents Hosts as a sheet over the chats,
# closed by `header-close`. (Between the tab redesign and the menu, Hosts was a
# tab and this flow left it by the tab bar.)
- tapOn:
    id: "server-switcher"
- assertVisible: "Hosts"
- assertVisible:
    id: "server-demo"
- tapOn:
    id: "header-close"
- assertVisible: "Chats"

# Everything else is behind the menu, the "…" beside "+". Each destination is
# asserted by something only it renders, not by its name: the name is also a
# row of the menu, so it would pass against a sheet that never opened.
- runFlow:
    file: regression/_menu.yaml
    env:
      ITEM: Settings
- runFlow:
    when:
      visible:
        id: settings-section-conversations
    commands:
      - tapOn:
          id: settings-section-conversations
- assertVisible:
    id: "toggle-tool-activity"
- tapOn:
    id: "header-close"
- assertVisible: "Chats"

- runFlow:
    file: regression/_menu.yaml
    env:
      ITEM: Hosts
- assertVisible:
    id: "server-demo"
- tapOn:
    id: "header-close"
- assertVisible: "Chats"
