# Launch, reach every top-level destination, assert a key element on each.
#
# Deliberately does NOT need a server: it covers the shape of the app, not its
# connection. `add-server.yaml` is the one that proves SSH really works.
appId: dev.herdr.HerdrChat
---
# stopApp first: launchApp on its own RESUMES, so a previous flow can leave the
# app deep in a thread and every assertion here would be about the wrong screen.
# (clearState would restart cleanly but also wipes the dev client's bundler URL.)
- stopApp
- launchApp
- assertVisible: "Chats"

# The host switcher sits under the title and is the only way to change hosts from
# the primary screen. It pushes the Hosts TAB — not a sheet, so there is no close
# button afterwards and the tab bar is the way back. This flow asserted a
# "Servers" screen dismissed by `header-close` until the tab redesign, and went
# on failing quietly because nobody re-ran it.
- tapOn:
    id: "server-switcher"
- assertVisible: "Hosts"

# Each tap below is unambiguous BECAUSE OF WHERE IT IS MADE: a destination's name
# is on screen only in the tab bar while you are somewhere else. Tapping
# "Settings" from Hosts matches one element; tapping it from Settings would also
# match the large title. Reordering these steps reintroduces that ambiguity.
- tapOn: "Settings"
# A row only Settings renders, rather than the word "Settings" — the tab bar
# shows that from anywhere, so it would pass against a screen that never loaded.
- assertVisible: "Cached messages"

- tapOn: "Chats"
- assertVisible: "Chats"
