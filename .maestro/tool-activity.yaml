# iPhone, Demo only. Tool calls fold into one summary line per run ("Read 1
# file"), closed by default; the thread header's switch opens every run. Clear the stored choice first, so the default is tested:
#   sqlite3 "$(xcrun simctl get_app_container booted dev.herdr.HerdrChat data)/Documents/SQLite/herdrchat.db" \
#     "delete from settings where key='showToolActivity'"
# Run with APPEARANCE=Dark, then Light.
appId: dev.herdr.HerdrChat
---
- stopApp
- launchApp
- runFlow: regression/_skip-welcome.yaml
# The Demo host is the one a fresh install opens on.
- assertVisible:
    id: server-switcher
- runFlow:
    file: regression/_menu.yaml
    env:
      ITEM: Settings
- scrollUntilVisible:
    element:
      text: '${APPEARANCE}'
    direction: DOWN
- tapOn: '${APPEARANCE}'
- tapOn:
    id: header-close
# w1 is the first row: the list is swiped back to its top, since a row scrolled
# up under the search field still counts as visible to Maestro. The drag starts
# inside the list: a plain swipe begins on the search field, which does not scroll.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 85%
- waitForAnimationToEnd
- tapOn:
    id: chat-row-w1
- assertVisible: '.*Found it.*'
- assertVisible: 'Read 1 file'
- assertNotVisible: 'Read client.ts'
- assertVisible:
    id: thread-tool-toggle
    checked: false
- takeScreenshot: tools-hidden
- tapOn:
    id: thread-tool-toggle
- assertVisible:
    id: thread-tool-toggle
    checked: true
- assertVisible: 'Read client.ts'
- takeScreenshot: tools-shown
- tapOn:
    id: thread-tool-toggle
- assertVisible:
    id: thread-tool-toggle
    checked: false
