# App checks and dependency-free host-script tests.
# Native builds and physical-device acceptance are separate release checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The setup guide asks contributors for 22+; CI holds the floor so a
          # change that needs something newer fails here rather than on someone
          # else's machine.
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs the lockfile exactly and fails if
      # package.json and the lock disagree, which is a real failure mode here —
      # the lock has drifted from package.json before.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Host script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # The only place Android compiles: its Kotlin (modules/herdr-ssh/android)
  # was never built before this job. A debug build, so no signing key, and one
  # ABI, since the point is that it compiles, not a release.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Android Gradle Plugin 8.12 (React Native 0.86) runs on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Build the debug app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
