# App checks and dependency-free host-script tests.
# Native builds and physical-device acceptance are separate release checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The setup guide asks contributors for 22+; CI holds the floor so a
          # change that needs something newer fails here rather than on someone
          # else's machine.
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs the lockfile exactly and fails if
      # package.json and the lock disagree, which is a real failure mode here —
      # the lock has drifted from package.json before.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Host script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
